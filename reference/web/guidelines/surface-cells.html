<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 24px; }
  .cell-h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  p { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="cell-grid" style="grid-template-columns:1fr 1fr;">
    <div class="cell-fk" style="background:var(--accent-soft)">
      <span class="cell-label">About</span>
      <div class="cell-h3">What is Fukuii?</div>
      <p>A Scala EVM execution client, on a single binary.</p>
    </div>
    <div class="cell-fk cell-fk--elev">
      <span class="cell-label">Consensus model</span>
      <div class="cell-h3">One binary</div>
      <p>PoW Ethash and PoS Engine API.</p>
    </div>
    <div class="cell-fk" style="grid-column:1 / -1; padding:0;">
      <a class="cell-cta" href="#">View on GitHub →</a>
    </div>
  </div>
</body>
</html>
