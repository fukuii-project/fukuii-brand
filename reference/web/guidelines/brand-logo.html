<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 24px; display: flex; align-items: center; gap: 36px; }
  img { width: 150px; height: 150px; object-fit: contain; }
  .word { font-family: var(--font-sans); font-weight: 700; font-size: 36px; letter-spacing: 0.22em; }
  .sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); margin-top: 8px; }
  p { font-size: 13px; color: var(--text-muted); margin-top: 14px; max-width: 30ch; line-height: 1.5; }
</style>
</head>
<body>
  <img src="../../../logo/fukuii-hex-logo.png" alt="Fukuii logo">
  <div>
    <div class="word">FUKUII</div>
    <div class="sub">Ethereum Virtual Machine Client</div>
    <p>Sticker-style hex badge mascot. Present on near-black; wordmark in DM Sans 700, wide tracking.</p>
  </div>
</body>
</html>
