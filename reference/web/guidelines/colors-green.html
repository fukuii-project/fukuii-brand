<!-- @dsCard group="Colors" viewport="700x150" name="Brand greens" subtitle="Sampled from the logo — #50a060 is primary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; }
  .chip { height: 62px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 10px; margin-top: 7px; color: var(--text-muted); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1e4a2d"></div><div class="name">green</div><div class="hex">#1E4A2D</div></div>
    <div class="sw"><div class="chip" style="background:#2d6b40"></div><div class="name">green-2</div><div class="hex">#2D6B40</div></div>
    <div class="sw"><div class="chip" style="background:#50a060"></div><div class="name">green-3 · primary</div><div class="hex">#50A060</div></div>
    <div class="sw"><div class="chip" style="background:#60b040"></div><div class="name">green-char</div><div class="hex">#60B040</div></div>
    <div class="sw"><div class="chip" style="background:#70c080"></div><div class="name">green-light</div><div class="hex">#70C080</div></div>
  </div>
</body>
</html>
