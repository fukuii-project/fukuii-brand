<!-- @dsCard group="Colors" viewport="700x150" name="Gold & accents" subtitle="Old gold secondary, dusty-rose worm accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; }
  .chip { height: 62px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 10px; margin-top: 7px; color: var(--text-muted); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#d6b56b"></div><div class="name">gold-2</div><div class="hex">#D6B56B</div></div>
    <div class="sw"><div class="chip" style="background:#b8964f"></div><div class="name">gold</div><div class="hex">#B8964F</div></div>
    <div class="sw"><div class="chip" style="background:#c06060"></div><div class="name">pink · worm</div><div class="hex">#C06060</div></div>
    <div class="sw"><div class="chip" style="background:rgba(214,181,107,0.18); border-color:rgba(214,181,107,0.4)"></div><div class="name">gold-soft</div><div class="hex">badge bg</div></div>
  </div>
</body>
</html>
