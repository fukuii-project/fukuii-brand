<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces & text" subtitle="Green-tinted inks, ivory text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 10px; margin-top: 7px; color: var(--text-muted); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0f130d"></div><div class="name">ink-2 · bg</div><div class="hex">#0F130D</div></div>
    <div class="sw"><div class="chip" style="background:#1a1f16"></div><div class="name">ink · elev</div><div class="hex">#1A1F16</div></div>
    <div class="sw"><div class="chip" style="background:rgba(80,160,96,0.06);"></div><div class="name">bg-card</div><div class="hex">green 6%</div></div>
    <div class="sw"><div class="chip" style="background:#f5f3ed"></div><div class="name">ivory · text</div><div class="hex">#F5F3ED</div></div>
    <div class="sw"><div class="chip" style="background:#c5c3b8"></div><div class="name">ivory-dim</div><div class="hex">#C5C3B8</div></div>
  </div>
</body>
</html>
