<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-mono); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--accent); border-radius: 1px; width: 24px; }
  .lab { font-size: 10px; color: var(--text-subtle); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><div class="lab">2<br>8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="lab">3<br>12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="lab">4<br>16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="lab">6<br>24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="lab">8<br>32</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="lab">10<br>40</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="lab">12<br>48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="lab">16<br>64</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="lab">20<br>80</div></div>
  </div>
</body>
</html>
