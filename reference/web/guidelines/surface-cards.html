<!-- @dsCard group="Surfaces" viewport="700x220" name="Cards, badges & code" subtitle="Rounded card, status badges, command block" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 18px; align-items: start; }
  .card-fk { padding: 18px; }
  h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="badges">
        <span class="badge-fk badge-green">Primary</span>
        <span class="badge-fk">Planned</span>
        <span class="badge-fk badge-gold">Alpha v0.7</span>
      </div>
      <div class="card-fk">
        <h3>Dual EL client</h3>
        <p>Native Ethash for ETC. Engine API for post-Merge Ethereum.</p>
      </div>
    </div>
    <pre class="code-block" style="margin:0"><span class="cm"># Mordor testnet</span>
docker <span class="kw">run</span> ghcr.io/chippr-robotics/fukuii \
  --network <span class="str">mordor</span></pre>
  </div>
</body>
</html>
