<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 24px; }
  .hero { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; }

</style>
</head>
<body>
  <div class="hero">Built to <span class="gradient-text">finance&rsquo;s standard.</span></div>
  <div class="title">One binary, any network.</div>
  <div class="meta">DM Sans · 800 / 700 · tracking −0.03em</div>
</body>
</html>
