<!-- @dsCard group="Type" viewport="700x200" name="Technical — JetBrains Mono" subtitle="First-class voice: chain IDs, versions, ports, labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-mono); padding: 24px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 32px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; }
  .k { color: var(--text-subtle); }
  .v { color: var(--fk-gold-2); }
</style>
</head>
<body>
  <div class="eyebrow">JetBrains Mono · technical voice</div>
  <div class="grid">
    <div class="row"><span class="k">chain</span><span class="v">61 · ETC</span></div>
    <div class="row"><span class="k">version</span><span class="v">Alpha v0.7</span></div>
    <div class="row"><span class="k">authrpc</span><span class="v">:8551</span></div>
    <div class="row"><span class="k">jdk</span><span class="v">25 LTS</span></div>
    <div class="row"><span class="k">scala</span><span class="v">3 LTS</span></div>
    <div class="row"><span class="k">sync</span><span class="v">SNAP</span></div>
  </div>
</body>
</html>
