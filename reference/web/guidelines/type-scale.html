<!-- @dsCard group="Type" viewport="700x250" name="Type scale" subtitle="11px micro-label to 44px hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: 22px; }
  .line { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border); padding: 5px 0; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); width: 88px; flex: none; }
  .ex { font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="line"><span class="tok">4xl · 44</span><span class="ex" style="font-size:40px; font-weight:800">Fukuii</span></div>
  <div class="line"><span class="tok">3xl · 40</span><span class="ex" style="font-size:30px">Section title</span></div>
  <div class="line"><span class="tok">2xl · 30</span><span class="ex" style="font-size:24px">Cell heading</span></div>
  <div class="line"><span class="tok">md · 17</span><span class="ex" style="font-size:17px">Lead / subtitle</span></div>
  <div class="line"><span class="tok">base · 15</span><span class="ex" style="font-size:15px">Body copy default</span></div>
  <div class="line"><span class="tok">2xs · 11</span><span class="ex" style="font-size:11px; font-family:var(--font-mono); letter-spacing:0.12em">MONO CELL LABEL</span></div>
</body>
</html>
