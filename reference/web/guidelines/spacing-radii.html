<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="8 / 14 / 22 / 32 — plus sharp cells & pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-mono); padding: 22px; }
  .row { display: flex; gap: 18px; align-items: center; }
  .item { text-align: center; }
  .box { width: 60px; height: 60px; background: var(--bg-card); border: 1px solid var(--border-strong); }
  .lab { font-size: 11px; color: var(--text-subtle); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:0"></div><div class="lab">none · cells</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="lab">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="lab">md · 14 · card</div></div>
    <div class="item"><div class="box" style="border-radius:22px"></div><div class="lab">lg · 22</div></div>
    <div class="item"><div class="box" style="border-radius:32px"></div><div class="lab">xl · 32 · cta</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="lab">pill · badge</div></div>
  </div>
</body>
</html>
