<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Scoped fontconfig for rendering Fukuii brand assets.

  Makes the vendored fonts in this directory discoverable WITHOUT installing them
  system-wide. Used by pointing FONTCONFIG_FILE at this file, e.g.:

      FONTCONFIG_FILE="$PWD/fonts/fonts.conf" inkscape ...

  `prefix="relative"` resolves the directory relative to THIS file, so the config
  is portable across machines and CI with no absolute paths.
-->
<fontconfig>
  <!-- The vendored brand fonts (DM Sans, JetBrains Mono) — the ONLY fonts visible. -->
  <dir prefix="relative">.</dir>

  <!-- Deliberately hermetic: system fonts are NOT included.

       If /etc/fonts/fonts.conf is included, a system-installed copy of a brand font
       can win the match over the vendored file (observed: a system JetBrainsMono-Regular
       beat the vendored JetBrainsMono[wght].ttf), so renders would differ per machine.
       Excluding it guarantees every render — local or CI — uses exactly these files.

       fontconfig always returns a best match, so a family that is NOT vendored here
       silently resolves to one of these files rather than failing. Vendor every family
       an asset needs. -->

</fontconfig>
